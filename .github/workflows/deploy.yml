name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub's OIDC token. Do not add long-lived AWS keys here.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The infrastructure exists now, so a missing variable is a real error.
      # This used to skip quietly, which made a no-op deploy look successful.
      - name: Check deploy configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          missing=""
          [ -z "$ROLE_ARN" ] && missing="$missing AWS_DEPLOY_ROLE_ARN"
          [ -z "$BUCKET" ]   && missing="$missing S3_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing repository variable(s):$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            echo "They must be VARIABLES (vars.*), not secrets."
            exit 1
          fi
          echo "Deploying to bucket: $BUCKET"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build --if-present

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Sync to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
          BUILD_DIR: ${{ vars.BUILD_DIR || 'out' }}
        run: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error title=No build output::Expected '$BUILD_DIR'. Next.js static export writes to out/. Check output:'export' is set in next.config.ts."
            exit 1
          fi
          # Hashed assets cache hard; everything else must revalidate so a
          # deploy is visible immediately.
          aws s3 sync "$BUILD_DIR" "s3://$BUCKET" --delete \
            --exclude "*.html" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync "$BUILD_DIR" "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Verify the site is populated
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          count=$(aws s3 ls "s3://$BUCKET" --recursive | wc -l | tr -d ' ')
          echo "Objects in s3://$BUCKET: $count"
          if [ "$count" = "0" ]; then
            echo "::error title=Deploy wrote nothing::The sync completed but the bucket is empty."
            exit 1
          fi
          aws s3 ls "s3://$BUCKET/index.html" >/dev/null || {
            echo "::error title=No index.html::The bucket has objects but no index.html at the root."
            exit 1
          }
